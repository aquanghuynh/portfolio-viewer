<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quang Huynh | Design Portfolio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            background: #1e1e1e;
        }

        .viewer {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top navigation bar */
        .toolbar {
            height: 56px;
            min-height: 56px;
            background: #111111;
            color: #ffffff;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 20px;
        }

        .title {
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 8px 14px;

            color: #ffffff;
            background: #333333;

            border: 1px solid #555555;
            border-radius: 5px;

            text-decoration: none;
            font-size: 14px;

            cursor: pointer;
        }

        .button:hover {
            background: #444444;
        }

        /* PDF viewer */
        .pdf-container {
            flex: 1;
            width: 100%;
            height: calc(100vh - 56px);
            background: #2b2b2b;
        }

        .pdf-viewer {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Mobile */
        @media (max-width: 600px) {
            .toolbar {
                padding: 0 10px;
            }

            .title {
                font-size: 14px;
            }

            .button {
                padding: 7px 10px;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <div class="viewer">

        <!-- Toolbar -->
        <div class="toolbar">

            <div class="title">
                Quang Huynh | Design Portfolio
            </div>

            <div class="buttons">

                <!-- Open PDF in new tab -->
                <a
                    class="button"
                    href="portfolio.pdf"
                    target="_blank"
                    rel="noopener noreferrer">
                    Open PDF
                </a>

                <!-- Download PDF -->
                <a
                    class="button"
                    href="portfolio.pdf"
                    download="Quang-Huynh-Design-Portfolio.pdf">
                    Download
                </a>

            </div>

        </div>

        <!-- PDF -->
        <div class="pdf-container">

            <iframe
                class="pdf-viewer"
                src="portfolio.pdf"
                title="Quang Huynh Design Portfolio">
            </iframe>

        </div>

    </div>

</body>
</html>
